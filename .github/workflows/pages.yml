name: Test and deploy Veldra 3D
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject partial CAD uploads and report absent compatibility source
        id: inventory
        run: node tools/check-cad-availability.mjs
      - name: Install CAD libraries only when the implementation exists
        if: steps.inventory.outputs.cad == 'true'
        run: npm run vendor:cad
      - name: Install development-only browser tools
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          CHROMIUM=$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          echo "CHROMIUM=$CHROMIUM" >> "$GITHUB_ENV"
      - name: Verify the modeler, both builds, CPU final renderer and actual WebGPU
        run: bash tools/verify-app.sh
      - name: Verify CAD implementation when present
        if: steps.inventory.outputs.cad == 'true'
        run: bash tools/verify-cad.sh
      - name: Guard against publishing an obsolete or non-main checkout
        id: publication
        run: |
          git fetch origin main
          if [ "$GITHUB_REF" = 'refs/heads/main' ] && [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping publication: main advanced or this is not a main checkout.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit verified generated distribution, screenshots and reports
        if: steps.publication.outputs.publish == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist examples docs/*.png tests/*.json tests/*console.txt tests/*.tap
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          lines = []
          for name in sorted(set(paths)):
              path = pathlib.Path(name)
              if name and name != 'CHECKSUMS.sha256' and path.is_file():
                  lines.append(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + name + '\n')
          pathlib.Path('CHECKSUMS.sha256').write_text(''.join(lines))
          PY
          git add CHECKSUMS.sha256
          git diff --cached --quiet || git commit -m 'build: refresh verified application distribution and recovery test evidence'
          git push origin HEAD:main
      - name: Stage public site with source commit metadata
        if: steps.publication.outputs.publish == 'true'
        run: SOURCE_COMMIT=$(git rev-parse HEAD) npm run build:pages
      - name: Use GitHub Actions as the Pages source
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TYPE=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$TYPE" != 'workflow' ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow > /dev/null
          fi
      - uses: actions/configure-pages@v5
        if: steps.publication.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.publication.outputs.publish == 'true'
        with:
          path: _site
      - name: Preserve verification evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            tests/*results*
            tests/*console.txt
            docs/*.png
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
