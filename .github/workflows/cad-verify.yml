name: Application and CAD recovery verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cad-verification-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  recovery-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cad: ${{ steps.inventory.outputs.cad }}
      archive: ${{ steps.inventory.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject partial uploads and report unavailable implementations
        id: inventory
        run: node tools/check-cad-availability.mjs
  application:
    needs: recovery-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development-only browser tools
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          CHROMIUM=$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          echo "CHROMIUM=$CHROMIUM" >> "$GITHUB_ENV"
      - name: Verify core, both application builds, CPU rendering and actual WebGPU
        run: bash tools/verify-app.sh
      - name: Preserve verification evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-verification-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            tests/*results*
            tests/*console.txt
            docs/*.png
  cad:
    needs: recovery-inventory
    if: needs.recovery-inventory.outputs.cad == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked replaceable CAD libraries
        run: npm run vendor:cad
      - name: Install development browser
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          CHROMIUM=$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          echo "CHROMIUM=$CHROMIUM" >> "$GITHUB_ENV"
      - name: Core, actual WASM, native workers, sandbox and required GPU checks
        run: bash tools/verify-cad.sh
      - name: Preserve CAD verification evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-verification-${{ github.run_id }}
          path: |
            tests/*results*
            tests/*console.txt
            docs/*.png
            vendor/manifest.json
  native-archive-reader:
    needs: recovery-inventory
    if: needs.recovery-inventory.outputs.archive == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate JavaScript-native binary and XML files
        run: node tools/native-archive-fixtures.mjs
      - name: Read files using the independent public native serialization API
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/grasshopper/8.35.26251.13001/grasshopper.8.35.26251.13001.nupkg' -OutFile "$env:RUNNER_TEMP/sdk.zip"
          Expand-Archive "$env:RUNNER_TEMP/sdk.zip" "$env:RUNNER_TEMP/gh-sdk"
          Copy-Item "$env:RUNNER_TEMP/gh-sdk/lib/net48/GH_IO.dll" .
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe" /nologo /r:GH_IO.dll /r:System.Drawing.dll /r:System.Core.dll tests/NativeArchiveVerify.cs
          if ($LASTEXITCODE -ne 0) { throw 'Reader test compilation failed' }
          ./NativeArchiveVerify.exe | Tee-Object tests/native-archive-reader-console.txt
          if ($LASTEXITCODE -ne 0) { throw 'Independent native archive reader failed' }
          Remove-Item GH_IO.dll,NativeArchiveVerify.exe
      - name: Preserve interoperability evidence, never the SDK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-archive-reader-${{ github.run_id }}
          path: |
            tests/native-output/*
            tests/native-archive-reader-console.txt
